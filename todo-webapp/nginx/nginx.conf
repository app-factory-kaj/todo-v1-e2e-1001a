worker_processes  auto;
pid        /tmp/nginx-runtime/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout;
    error_log   /dev/stderr notice;

    sendfile        on;
    keepalive_timeout  65;

    # Everything nginx writes at runtime (this pid file, these caches, and the
    # resolved server block under conf.d/) lives under /tmp. The platform runs
    # this pod under an arbitrary UID with a read-only root filesystem, so
    # nothing under /etc or /var can be written at container start; /tmp is
    # the one path guaranteed writable whichever UID lands.
    client_body_temp_path /tmp/nginx-runtime/cache/client_temp;
    proxy_temp_path       /tmp/nginx-runtime/cache/proxy_temp;
    fastcgi_temp_path     /tmp/nginx-runtime/cache/fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx-runtime/cache/uwsgi_temp;
    scgi_temp_path        /tmp/nginx-runtime/cache/scgi_temp;

    include /tmp/nginx-runtime/conf.d/*.conf;
}
